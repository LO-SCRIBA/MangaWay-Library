name: MangaWay Cloud Sync Automated Bot

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository options
      uses: actions/checkout@v4

    - name: Set up Python environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install production dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests internetarchive urllib3

    - name: Execute synchronization pipeline
      run: python mangaway_worker.py
