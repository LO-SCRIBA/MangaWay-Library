name: 1. MangaDex Cloud Uploader

on:
  schedule:
    - cron: '0 2 * * *' # Every night
  workflow_dispatch: # Manual button

jobs:
  upload_manga:
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: pip install requests Pillow internetarchive urllib3

    - name: Run MangaDex Scraper & IA Pusher
      run: python mangaway_pc_worker.py 2>&1
