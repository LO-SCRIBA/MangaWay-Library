name: MangaWay Automated Cloud Uploader

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 2 * * *' # 🎯 Gira da solo ogni notte alle 2:00 a PC spento!
  workflow_dispatch: # Ti permette di farlo partire a mano con un tasto su GitHub

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Hardware Optimizers
      run: |
        python -m pip install --upgrade pip
        pip install requests Pillow internetarchive urllib3

    - name: Execute 480p Stritolamento Loop
      run: |
        python mangaway_pc_worker.py
