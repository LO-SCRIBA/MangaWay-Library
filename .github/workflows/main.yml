name: MangaWay Auto Scraper

on:
  schedule:
    - cron: '0 2 * * *' # Parte da solo ogni notte alle 2:00
  workflow_dispatch: # Ti permette di farlo partire a mano con il bottone

jobs:
  build:
    runs-on: ubuntu-24.04
    
    # 🔥 BLOCCO DI SICUREZZA FONDAMENTALE FORZATO
    permissions:
      contents: write

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Graphic and Cloud Dependencies
      run: |
        pip install requests Pillow internetarchive

    - name: Run MangaWay Compiler
      env:
        IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
        IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
      run: |
        python mangaway_bot.py

    - name: Commit and Push Updated catalog.json
      run: |
        git config --global user.name "MangaWay-Bot"
        git config --global user.email "bot@mangaway.store"
        git add catalog.json || echo "No files to add"
        git commit -m "Auto-Update: New manga chapters added by LO-SCRIBA Bot" || echo "No changes to commit"
        git push origin main || git push origin master
