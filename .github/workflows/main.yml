name: MangaWay Auto Scraper

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    
    permissions:
      contents: write

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Python Dependencies
      run: |
        pip install requests Pillow

    - name: Run MangaWay Compiler
      run: |
        python mangaway_bot.py 2>&1

    - name: Commit and Push All Manga Files to Repository
      run: |
        git config --global user.name "MangaWay-Bot"
        git config --global user.email "bot@mangaway.store"
        
        git add catalog.json
        git add covers/* || echo "Nessuna copertina trovata"
        
        git commit -m "Auto-Update: Catalog and textures updated via Pure Python" || echo "No changes to commit"
        git push origin main || git push origin master

