name: MangaWay Auto Scraper

on:
  schedule:
    - cron: '0 2 * * *' # Si accende da solo TUTTI I GIORNI alle 2 di notte!
  workflow_dispatch: # Ti permette anche di farlo partire a mano premendo un tasto su GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v3

    - name: Set up Python Environment
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Graphic Dependencies
      run: |
        pip install requests Pillow

    - name: Run MangaWay Compiler
      run: |
        python mangaway_bot.py

    - name: Commit and Push Updated catalog.json
      run: |
        git config --global user.name "MangaWay-Bot"
        git config --global user.email "bot@mangaway.store"
        git add catalog.json
        git commit -m "Auto-Update: New manga chapters added by LO-SCRIBA Bot" || echo "No changes to commit"
        git push
