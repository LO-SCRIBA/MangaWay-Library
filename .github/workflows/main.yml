name: MangaWay Auto Scraper

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    
    permissions:
      contents: write

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Graphic Dependencies
      run: |
        pip install requests Pillow

    - name: Install devkitPRO Tools (tex3ds)
      run: |
        sudo apt-get update
        sudo apt-get install -y wget gdebi-core
        
        # 🎯 LINK DIRETTO DEFINITIVO: Scarichiamo direttamente il file di sblocco ufficiale senza errori di reindirizzamento
        wget --user-agent="Mozilla/5.0" https://github.com
        
        sudo gdebi -n devkitpro-keyring.deb
        echo "deb [signed-by=/usr/share/keyrings/devkitpro-keyring.gpg] https://apt.devkitpro.org/ ubuntu main" | sudo tee /etc/apt/sources.list.d/devkitpro.list
        sudo apt-get update
        sudo apt-get install -y 3ds-tools
        
        # Aggiunge gli strumenti al PATH di sistema
        echo "/opt/devkitpro/tools/bin" >> $GITHUB_PATH

    - name: Run MangaWay Compiler
      run: |
        python mangaway_bot.py 2>&1

    - name: Commit and Push All Manga Files to Repository
      run: |
        git config --global user.name "MangaWay-Bot"
        git config --global user.email "bot@mangaway.store"
        
        git add catalog.json
        git add covers/* || echo "Nessuna copertina trovata in covers/"
        git add *.cbz || echo "Nessun file CBZ trovato"
        
        git commit -m "Auto-Update: Catalog index and 3DS native textures optimized" || echo "No changes to commit"
        git push origin main || git push origin master
