name: MangaWay Auto Scraper

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    
    # Sblocca i permessi di scrittura per i Token di GitHub
    permissions:
      contents: write

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Scarica tutta la cronologia per evitare conflitti di Git

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Graphic and Cloud Dependencies
      run: |
        pip install requests Pillow internetarchive

    - name: Run MangaWay Compiler
      env:
        IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
        IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
      run: |
        python mangaway_bot.py 2>&1

    - name: Commit and Push Updated catalog.json
      run: |
        git config --global user.name "MangaWay-Bot"
        git config --global user.email "bot@mangaway.store"
        # Forza Git a vedere il file catalog.json anche se prima lo ignorava
        git add -f catalog.json
        git commit -m "Auto-Update: New manga chapters added by LO-SCRIBA Bot" || echo "No changes to commit"
        git push origin main || git push origin master
