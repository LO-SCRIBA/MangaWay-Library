name: MangaWay Full Cloud Pipeline

on:
  schedule:
    - cron: '0 2 * * *' # Runs automatically every night
  workflow_dispatch: # Allows you to press "Run workflow" manually

jobs:
  build:
    runs-on: ubuntu-24.04
    
    permissions:
      contents: write

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Cloud Processing Libraries
      run: |
        pip install requests Pillow internetarchive urllib3

    - name: Run Unified MangaWay Processing Engine
      run: |
        python mangaway_bot.py 2>&1

    - name: Commit and Push 3DS Assets to GitHub Repository
      run: |
        git config --global user.name "MangaWay-Bot"
        git config --global user.email "bot@mangaway.store"
        
        git add catalog.json
        git add covers/* || echo "No textures found to commit"
        
        git commit -m "Cloud Sync: Catalog and native 3DS textures compiled" || echo "No changes to commit"
        git push origin main || git push origin master
