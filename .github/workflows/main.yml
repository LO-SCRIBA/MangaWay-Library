name: MangaWay Auto Scraper

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    
    permissions:
      contents: write

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Graphic Dependencies
      run: |
        pip install requests Pillow

    - name: Build and Install tex3ds natively
      run: |
        sudo apt-get update
        sudo apt-get install -y libpng-dev build-essential
        
        # Scarichiamo il codice sorgente ufficiale dello strumento tex3ds di devkitPRO
        git clone https://github.com/devkitPro/3dstools
        cd tex3ds
        
        # Compiliamo l'eseguibile al volo sulla macchina virtuale
        make
        
        # Lo spostiamo nella cartella dei binari di sistema in modo che Python possa usarlo ovunque
        sudo cp tex3ds /usr/local/bin/
        cd ..

    - name: Run MangaWay Compiler
      run: |
        python mangaway_bot.py 2>&1

    - name: Commit and Push All Manga Files to Repository
      run: |
        git config --global user.name "MangaWay-Bot"
        git config --global user.email "bot@mangaway.store"
        
        git add catalog.json
        git add covers/* || echo "Nessuna copertina trovata in covers/"
        git add *.cbz || echo "Nessun file CBZ trovato"
        
        git commit -m "Auto-Update: Catalog index and 3DS native textures optimized" || echo "No changes to commit"
        git push origin main || git push origin master
